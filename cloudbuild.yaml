# Google Cloud Build Pipeline for CortexOps
steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/cortexops:$COMMIT_SHA', '.']

  # Push to Google Artifact Registry / Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/cortexops:$COMMIT_SHA']

  # Deploy to Google Cloud Run with WebSocket & HTTP/2 support
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'cortexops-occ'
      - '--image'
      - 'gcr.io/$PROJECT_ID/cortexops:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--set-env-vars'
      - 'GOOGLE_GENAI_USE_VERTEXAI=false'

images:
  - 'gcr.io/$PROJECT_ID/cortexops:$COMMIT_SHA'
